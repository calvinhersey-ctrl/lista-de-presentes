# Supabase pauses free projects after about a week with no activity.
# This reads the (public) gift list every 3 days so the shared list never goes to sleep.
name: Keep the gift list awake
on:
  schedule:
    - cron: "17 12 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the gift list
        run: |
          curl -fsS "https://dxkttakkgzyhptvuzcbs.supabase.co/rest/v1/gifts?select=id&limit=1" \
